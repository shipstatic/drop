name: Publish

on:
  push:
    branches: [main, development]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # The version decides everything: skip when this version is already on
      # the registry (any push — workflow edits, docs — is a safe no-op, so
      # publishes are idempotent), and derive the dist-tag from the version —
      # prerelease versions (any `-` suffix) publish under `beta` so `latest`
      # keeps resolving the last stable; promoting a stable version needs no
      # workflow change. The branch decides only which pushes are eligible.
      # No --provenance: the source repo is private, so npm can't attest it.
      - id: version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on the registry — nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            if [[ "$VERSION" == *-* ]]; then TAG=beta; else TAG=latest; fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.publish == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.4

      - if: steps.version.outputs.publish == 'true'
        run: pnpm install --no-frozen-lockfile

      - if: steps.version.outputs.publish == 'true'
        run: pnpm run build

      - if: steps.version.outputs.publish == 'true'
        run: pnpm publish --access public --no-git-checks --tag "${{ steps.version.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - if: steps.version.outputs.publish == 'true'
        uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "✅ @shipstatic/drop ${{ steps.version.outputs.version }} published (${{ steps.version.outputs.tag }})"

      - if: failure()
        uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "🔴 @shipstatic/drop publish failed"
