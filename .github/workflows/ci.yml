name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # No `version:` — pnpm/action-setup reads the `packageManager` field,
      # so the pnpm pin lives in exactly one place.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec biome ci .

      - run: pnpm typecheck

      - run: pnpm run build

      # Coverage in place of a bare test run: the same suite, plus the ratchet in
      # vitest.config.ts.
      - run: pnpm coverage

      # Capability tier: real-browser certification of File/webkitRelativePath/ZIP
      # semantics jsdom can only approximate. Separate invocation, no coverage
      # coupling — same pattern as ship's browser tier and the backend's workerd tier.
      - run: pnpm exec playwright install chromium --with-deps

      - run: pnpm test:browser

      # The published artifact itself: exports map, CJS/ESM resolution, dts.
      - run: pnpm check:package


  # The publish DECISION, isolated in its own job so the channel is known at job
  # level. That is what lets `publish` below select its environment from it:
  # `environment:` is evaluated before a job's steps run, so it cannot read a step
  # of its own job.
  version:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - id: decide
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")

          # The VERSION decides the channel: a prerelease (any `-` suffix) goes to
          # `beta`, so `latest` keeps resolving the last stable release.
          if [[ "$VERSION" == *-* ]]; then TAG=beta; else TAG=latest; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # The BRANCH decides whether that channel may be published from here.
          # `latest` is main-only. A stable version on an integration branch is a
          # STAGED release, and staging one before merging is the normal flow — so
          # this skips rather than fails, exactly like the idempotence check below.
          if [[ "$TAG" == "latest" && "$GITHUB_REF_NAME" != "main" ]]; then
            echo "::notice title=Release staged::$NAME@$VERSION is a stable version. latest publishes only from main, so nothing was published from $GITHUB_REF_NAME. Merge to main to release it."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Idempotence: once the version is on the registry, any push is a no-op.
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on the registry — nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The second gate, and the one that does not depend on our own shell logic:
    # `npm-latest` accepts pushes from `main` ONLY (a deployment branch policy), and
    # NODE_AUTH_TOKEN lives in these two environments and NOWHERE at repo level. A
    # branch that cannot reach the environment cannot reach a credential either, so
    # publishing `latest` off `main` is not a thing this workflow can do — not a
    # thing it declines to do.
    environment: npm-${{ needs.version.outputs.tag }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # No `registry-url`: it makes setup-node write
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into a temp .npmrc,
      # and with no token in the env that line is an EMPTY credential. npm reads
      # any `_authToken` line — even empty — as "token auth is configured" and
      # never attempts the OIDC handshake, so the publish goes out anonymous and
      # 403s (actions/setup-node#1551). Dropping the input, not just the env var,
      # is the fix. npm's default registry is registry.npmjs.org already.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      # Trusted publishing (OIDC), not a token. npm has restricted token-based
      # direct publishing for 2FA-protected accounts
      # (https://gh.io/npm-gat-bypass2fa-deprecation), so a long-lived credential
      # can no longer publish at all — it can still write dist-tags, which is why
      # the failure looked like a permissions problem rather than a policy one.
      # OIDC needs npm >= 11.5.1; node 22 bundles npm 10.x, and pnpm has no OIDC
      # support at all, so the publish step is `npm`, not `pnpm`.
      - run: npm install -g npm@latest

      # No `--provenance`, deliberately — and this is drop-specific. The registry
      # REJECTS drop's provenance attestation with a bare 403: the bundle signs
      # and reaches the Sigstore transparency log, then the PUT is refused.
      # Isolated on 2026-07-27 by era-controlled A/B: identical PUTs with the
      # same freshly-exchanged OIDC token publish WITHOUT an attestation and
      # 403 WITH one, while types/ship/mcp publish with --provenance over the
      # byte-identical workflow. Most plausibly npm-side state stale from the
      # repo being private until 2026-07-27. Retest --provenance periodically;
      # restore it when the registry accepts the attestation.
      # TEMPORARY CAPTURE+REPLAY — the CLI's PUT fails with an EMPTY-body 403
      # while libnpmpublish PUTs succeed or get structured app-layer errors.
      # Stop reconstructing the difference; capture the CLI's exact body, replay
      # those bytes with a fresh token, and diff against a working body.
      - name: Capture and replay the CLI PUT
        run: |
          set +e
          RF="$(npm root -g)/npm/node_modules/npm-registry-fetch/lib/index.js"
          node -e '
            const fs=require("fs"); const p=process.argv[1];
            fs.appendFileSync(p, `
            const __orig = module.exports; const __fs = require("fs");
            let __n = 0;
            const __wrapped = (uri, opts = {}) => {
  try {
    if (opts.method && String(opts.method).toUpperCase() === "PUT") {
      __n++;
      const body = typeof opts.body === "object" ? JSON.stringify(opts.body) : String(opts.body);
      __fs.writeFileSync("/tmp/body-" + __n + ".json", body);
      console.error("[CAP] PUT", uri, "bytes=" + body.length,
        JSON.stringify({authType:opts.authType, scope:opts.scope, npmSession:opts.npmSession,
          npmCommand:opts.npmCommand, ua:(opts.userAgent||"").slice(0,50)}));
    }
  } catch (e) { console.error("[CAP] err", e.message); }
  return __orig(uri, opts);
            };
            Object.assign(__wrapped, __orig);
            module.exports = __wrapped;
            `);
            console.log("patched", p);
          ' "$RF"

          mint() {
            IDT=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
              | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).value')
            curl -sS -X POST -H "authorization: Bearer $IDT" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@shipstatic%2fdrop" \
              | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).token'
          }

          echo "########## 1: the real CLI publish (expected: 403, body captured) ##########"
          npm publish --access public --provenance=false --tag "beta" 2>&1 | grep -aE "CAP|npm error code|npm error 403" | head -8

          if [ ! -f /tmp/body-1.json ]; then echo "NO BODY CAPTURED — abort"; exit 0; fi

          echo "########## 2: replay the CLI's EXACT bytes, fresh token, minimal headers ##########"
          TOK=$(mint) node -e '
            (async () => {
              const fs = require("fs");
              const body = fs.readFileSync("/tmp/body-1.json");
              const r = await fetch("https://registry.npmjs.org/@shipstatic%2fdrop", {
                method: "PUT",
                headers: { "content-type": "application/json",
                           authorization: "Bearer " + process.env.TOK },
                body,
              });
              const t = await r.text();
              console.log("replay status:", r.status);
              console.log("replay headers:", JSON.stringify(Object.fromEntries(r.headers), null, 1));
              console.log("replay body:", t.slice(0, 500));
            })();
          '

          echo "########## 3: known-good shape via libnpmpublish (captures body-2) ##########"
          NPM_TOK=$(mint) node -e '
            const cp=require("child_process"),fs=require("fs"),path=require("path");
            const root=cp.execSync("npm root -g").toString().trim();
            const {publish}=require(path.join(root,"npm/node_modules/libnpmpublish"));
            const m=JSON.parse(fs.readFileSync("package.json","utf8"));
            cp.execSync("npm pack --pack-destination /tmp",{stdio:"ignore"});
            const tar=fs.readFileSync("/tmp/"+m.name.replace("@","").replace("/","-")+"-"+m.version+".tgz");
            publish(m,tar,{registry:"https://registry.npmjs.org/","//registry.npmjs.org/:_authToken":process.env.NPM_TOK,defaultTag:"beta",access:"public"})
              .then(()=>console.log("libnpmpublish: PUBLISHED"))
              .catch(e=>console.log("libnpmpublish: FAILED",e.statusCode));
          '

          echo "########## 4: diff CLI body vs known-good body ##########"
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("/tmp/body-2.json")) { console.log("no body-2"); process.exit(0); }
            const A = JSON.parse(fs.readFileSync("/tmp/body-1.json"));
            const B = JSON.parse(fs.readFileSync("/tmp/body-2.json"));
            const short = v => { const s = JSON.stringify(v); return s && s.length > 120 ? s.slice(0,120)+"…("+s.length+")" : s; };
            const diff = (a, b, label) => {
              const keys = [...new Set([...Object.keys(a||{}), ...Object.keys(b||{})])];
              for (const k of keys) {
                const va = JSON.stringify(a?.[k]), vb = JSON.stringify(b?.[k]);
                if (va !== vb) console.log(`${label}.${k}: CLI=${short(a?.[k])} GOOD=${short(b?.[k])}`);
              }
            };
            diff(A, B, "root");
            const vA = Object.keys(A.versions)[0], vB = Object.keys(B.versions)[0];
            console.log("versions:", vA, "vs", vB);
            diff(A.versions[vA], B.versions[vB], "ver");
          '
          exit 0

      - uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "✅ @shipstatic/drop ${{ needs.version.outputs.version }} published (${{ needs.version.outputs.tag }})"

      - if: failure()
        uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "🔴 @shipstatic/drop publish failed"
