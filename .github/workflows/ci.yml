name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # No `version:` — pnpm/action-setup reads the `packageManager` field,
      # so the pnpm pin lives in exactly one place.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec biome ci .

      - run: pnpm typecheck

      - run: pnpm run build

      # Coverage in place of a bare test run: the same suite, plus the ratchet in
      # vitest.config.ts.
      - run: pnpm coverage

      # Capability tier: real-browser certification of File/webkitRelativePath/ZIP
      # semantics jsdom can only approximate. Separate invocation, no coverage
      # coupling — same pattern as ship's browser tier and the backend's workerd tier.
      - run: pnpm exec playwright install chromium --with-deps

      - run: pnpm test:browser

      # The published artifact itself: exports map, CJS/ESM resolution, dts.
      - run: pnpm check:package


  # The publish DECISION, isolated in its own job so the channel is known at job
  # level. That is what lets `publish` below select its environment from it:
  # `environment:` is evaluated before a job's steps run, so it cannot read a step
  # of its own job.
  version:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - id: decide
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")

          # The VERSION decides the channel: a prerelease (any `-` suffix) goes to
          # `beta`, so `latest` keeps resolving the last stable release.
          if [[ "$VERSION" == *-* ]]; then TAG=beta; else TAG=latest; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # The BRANCH decides whether that channel may be published from here.
          # `latest` is main-only. A stable version on an integration branch is a
          # STAGED release, and staging one before merging is the normal flow — so
          # this skips rather than fails, exactly like the idempotence check below.
          if [[ "$TAG" == "latest" && "$GITHUB_REF_NAME" != "main" ]]; then
            echo "::notice title=Release staged::$NAME@$VERSION is a stable version. latest publishes only from main, so nothing was published from $GITHUB_REF_NAME. Merge to main to release it."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Idempotence: once the version is on the registry, any push is a no-op.
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on the registry — nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The second gate, and the one that does not depend on our own shell logic:
    # `npm-latest` accepts pushes from `main` ONLY (a deployment branch policy), and
    # NODE_AUTH_TOKEN lives in these two environments and NOWHERE at repo level. A
    # branch that cannot reach the environment cannot reach a credential either, so
    # publishing `latest` off `main` is not a thing this workflow can do — not a
    # thing it declines to do.
    environment: npm-${{ needs.version.outputs.tag }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # No `registry-url`, deliberately. When it is set, setup-node writes
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into a temp .npmrc;
      # with no token in the env that line is an EMPTY credential, and npm reads
      # any `_authToken` line — even empty — as "token auth is configured" and
      # so never attempts the OIDC handshake. The publish then goes out
      # anonymous and 403s (actions/setup-node#1551). It is the PRESENCE of the
      # token line, not the absence of a token value, that suppresses OIDC —
      # which is why dropping this input, not just the env var, is the fix.
      # npm's default registry is already registry.npmjs.org, so nothing is lost.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      # Trusted publishing (OIDC), not a token. npm has restricted token-based
      # direct publishing for 2FA-protected accounts
      # (https://gh.io/npm-gat-bypass2fa-deprecation), so a long-lived credential
      # can no longer publish at all — it can still write dist-tags, which is why
      # the failure looked like a permissions problem rather than a policy one.
      # OIDC needs npm >= 11.5.1; node 22 bundles npm 10.x, and pnpm has no OIDC
      # support at all, so the publish step is `npm`, not `pnpm`.
      - run: npm install -g npm@latest

      # TEMPORARY DIAGNOSTIC — remove once publishing is green.
      # Replays npm's OWN exchange protocol (lib/utils/oidc.js): POST with the
      # GitHub id-token as the bearer credential and an empty body — NOT a JSON
      # body. The response is what tells us the minted token's capability.
      - name: Diagnose OIDC exchange
        run: |
          set +e
          ID_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).value')

          curl -sS -i -X POST -H "authorization: Bearer $ID_TOKEN" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@shipstatic%2fdrop" \
            > /tmp/x.txt 2>&1

          node -e '
            const fs = require("fs");
            const raw = fs.readFileSync("/tmp/x.txt", "utf8");
            const i = raw.indexOf("\r\n\r\n");
            const head = i < 0 ? raw : raw.slice(0, i);
            const body = i < 0 ? "" : raw.slice(i + 4);
            console.log("--- exchange status + headers ---");
            for (const l of head.split(/\r?\n/)) {
              console.log(/authorization|set-cookie/i.test(l) ? l.split(":")[0] + ": <redacted>" : l);
            }
            console.log("--- exchange body (token value redacted, every other field shown) ---");
            try {
              const j = JSON.parse(body);
              const safe = {};
              for (const [k, v] of Object.entries(j)) {
                safe[k] = /token/i.test(k) ? "<" + String(v).length + " chars>" : v;
              }
              console.log(JSON.stringify(safe, null, 2));
              if (j.token) fs.writeFileSync("/tmp/npmtok", j.token);
            } catch (e) { console.log(body.slice(0, 600)); }
          '

          if [ -s /tmp/npmtok ]; then
            TOK=$(cat /tmp/npmtok)
            echo "--- what the minted token can see ---"
            printf 'whoami: '; curl -sS -o /dev/null -w '%{http_code}\n' -H "authorization: Bearer $TOK" https://registry.npmjs.org/-/whoami
            printf 'trust config: '
            curl -sS -w '\n[status %{http_code}]\n' -H "authorization: Bearer $TOK" \
              "https://registry.npmjs.org/-/package/@shipstatic%2fdrop/trust"
          fi
          exit 0

      # TEMPORARY: npm's CLI swallows the registry's 403 body. Drive the publish
      # through libnpmpublish directly so the real body + headers are visible, then
      # test whether STAGING is permitted where publishing is not — which is
      # precisely what a stage-only trusted publisher looks like.
      - name: Diagnose the 403
        run: |
          set +e
          node -e '
            const cp = require("child_process");
            const fs = require("fs");
            const path = require("path");
            const root = cp.execSync("npm root -g").toString().trim();
            const { publish } = require(path.join(root, "npm/node_modules/libnpmpublish"));
            const manifest = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const raw = cp.execSync("npm pack --json --pack-destination /tmp", { encoding: "utf8" });
            const packed = JSON.parse(raw.slice(raw.indexOf("[")));
            const tarball = fs.readFileSync("/tmp/" + packed[0].filename);
            const token = fs.readFileSync("/tmp/npmtok", "utf8").trim();
            publish(manifest, tarball, {
              registry: "https://registry.npmjs.org/",
              "//registry.npmjs.org/:_authToken": token,
              defaultTag: "beta",
            }).then(() => console.log("PUBLISH OK"))
              .catch(e => {
                console.log("=== THE REAL REGISTRY RESPONSE ===");
                console.log("code:", e.code, "status:", e.statusCode);
                console.log("message:", e.message);
                console.log("body:", JSON.stringify(e.body));
                let h = e.headers;
                try { h = h && typeof h.raw === "function" ? h.raw() : h; } catch (x) {}
                console.log("headers:", JSON.stringify(h, null, 2));
              });
          '
          echo "=== is STAGING permitted where publishing is not? ==="
          npm stage publish . 2>&1 | tail -25
          exit 0

      # The boring, canonical publish. No --access: the package already exists and
      # is public, and `--access` asks the registry to SET package access, which is
      # a settings write rather than a publish.
      - name: Publish
        run: npm publish --tag "${{ needs.version.outputs.tag }}"
        # No NODE_AUTH_TOKEN and no registry-url: with neither a token in the env
        # nor an `_authToken` line in .npmrc, npm attempts OIDC. It exchanges the
        # GitHub id-token for a short-lived publish credential against the trusted
        # publisher configured on npmjs.com. That publisher is scoped to repo +
        # workflow filename with the environment left BLANK — a package may have
        # only ONE trusted publisher, so it cannot name both npm-beta and
        # npm-latest; the GitHub environments still gate the branch, npm just
        # trusts the workflow file. No `--provenance`: drop's source is private
        # and npm cannot attest a private repo.

      - uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "✅ @shipstatic/drop ${{ needs.version.outputs.version }} published (${{ needs.version.outputs.tag }})"

      - if: failure()
        uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "🔴 @shipstatic/drop publish failed"
