name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # No `version:` — pnpm/action-setup reads the `packageManager` field,
      # so the pnpm pin lives in exactly one place.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec biome ci .

      - run: pnpm typecheck

      - run: pnpm run build

      # Coverage in place of a bare test run: the same suite, plus the ratchet in
      # vitest.config.ts.
      - run: pnpm coverage

      # Capability tier: real-browser certification of File/webkitRelativePath/ZIP
      # semantics jsdom can only approximate. Separate invocation, no coverage
      # coupling — same pattern as ship's browser tier and the backend's workerd tier.
      - run: pnpm exec playwright install chromium --with-deps

      - run: pnpm test:browser

      # The published artifact itself: exports map, CJS/ESM resolution, dts.
      - run: pnpm check:package


  # The publish DECISION, isolated in its own job so the channel is known at job
  # level. That is what lets `publish` below select its environment from it:
  # `environment:` is evaluated before a job's steps run, so it cannot read a step
  # of its own job.
  version:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - id: decide
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")

          # The VERSION decides the channel: a prerelease (any `-` suffix) goes to
          # `beta`, so `latest` keeps resolving the last stable release.
          if [[ "$VERSION" == *-* ]]; then TAG=beta; else TAG=latest; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # The BRANCH decides whether that channel may be published from here.
          # `latest` is main-only. A stable version on an integration branch is a
          # STAGED release, and staging one before merging is the normal flow — so
          # this skips rather than fails, exactly like the idempotence check below.
          if [[ "$TAG" == "latest" && "$GITHUB_REF_NAME" != "main" ]]; then
            echo "::notice title=Release staged::$NAME@$VERSION is a stable version. latest publishes only from main, so nothing was published from $GITHUB_REF_NAME. Merge to main to release it."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Idempotence: once the version is on the registry, any push is a no-op.
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on the registry — nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The second gate, and the one that does not depend on our own shell logic:
    # `npm-latest` accepts pushes from `main` ONLY (a deployment branch policy), and
    # NODE_AUTH_TOKEN lives in these two environments and NOWHERE at repo level. A
    # branch that cannot reach the environment cannot reach a credential either, so
    # publishing `latest` off `main` is not a thing this workflow can do — not a
    # thing it declines to do.
    environment: npm-${{ needs.version.outputs.tag }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # No `registry-url`: it makes setup-node write
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into a temp .npmrc,
      # and with no token in the env that line is an EMPTY credential. npm reads
      # any `_authToken` line — even empty — as "token auth is configured" and
      # never attempts the OIDC handshake, so the publish goes out anonymous and
      # 403s (actions/setup-node#1551). Dropping the input, not just the env var,
      # is the fix. npm's default registry is registry.npmjs.org already.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      # Trusted publishing (OIDC), not a token. npm has restricted token-based
      # direct publishing for 2FA-protected accounts
      # (https://gh.io/npm-gat-bypass2fa-deprecation), so a long-lived credential
      # can no longer publish at all — it can still write dist-tags, which is why
      # the failure looked like a permissions problem rather than a policy one.
      # OIDC needs npm >= 11.5.1; node 22 bundles npm 10.x, and pnpm has no OIDC
      # support at all, so the publish step is `npm`, not `pnpm`.
      - run: npm install -g npm@latest

      # TEMPORARY PROBE — no versions are published by A/B. Tests whether the
      # authenticated packument GET that `npm publish` performs between the
      # token exchange and the PUT consumes the single-use OIDC token. A PUT of
      # an ALREADY-EXISTING version distinguishes the outcomes without burning
      # anything: valid token -> app-layer "cannot publish over previously
      # published versions"; consumed token -> the bare 403 / route-already-used.
      - name: Probe token burn
        run: |
          set +e
          mint() {
            IDT=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
              | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).value')
            curl -sS -X POST -H "authorization: Bearer $IDT" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@shipstatic%2fdrop" \
              | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).token'
          }
          npm pack --pack-destination /tmp >/dev/null 2>&1

          putexisting() {  # $1 label, $2 token
            NPM_TOK="$2" node -e '
              const cp=require("child_process"),fs=require("fs"),path=require("path");
              const root=cp.execSync("npm root -g").toString().trim();
              const {publish}=require(path.join(root,"npm/node_modules/libnpmpublish"));
              const m=JSON.parse(fs.readFileSync("package.json","utf8"));
              const tar=fs.readFileSync("/tmp/"+m.name.replace("@","").replace("/","-")+"-"+m.version+".tgz");
              m.version="2.0.0-beta.3"; // EXISTS on the registry
              publish(m,tar,{registry:"https://registry.npmjs.org/","//registry.npmjs.org/:_authToken":process.env.NPM_TOK,defaultTag:"beta",access:"public"})
                .then(()=>console.log("UNEXPECTED: PUBLISHED over existing?!"))
                .catch(e=>{const b=e.body&&e.body.toString?e.body.toString():JSON.stringify(e.body);
                  console.log("PUT existing ->",e.statusCode,"body:",b)});
            '
          }

          echo "=== A: fresh token -> PUT existing (NO prior GET) ==="
          putexisting A "$(mint)"

          echo "=== B: fresh token -> authenticated GET packument -> PUT existing ==="
          T=$(mint)
          G=$(curl -sS -o /dev/null -w '%{http_code}' -H "authorization: Bearer $T" "https://registry.npmjs.org/@shipstatic%2fdrop")
          echo "GET packument: $G"
          putexisting B "$T"

          echo "=== C: fresh token -> PUT NEW beta.4 (no GET) — replica of bisect win ==="
          NPM_TOK="$(mint)" node -e '
            const cp=require("child_process"),fs=require("fs"),path=require("path");
            const root=cp.execSync("npm root -g").toString().trim();
            const {publish}=require(path.join(root,"npm/node_modules/libnpmpublish"));
            const m=JSON.parse(fs.readFileSync("package.json","utf8"));
            const tar=fs.readFileSync("/tmp/"+m.name.replace("@","").replace("/","-")+"-"+m.version+".tgz");
            publish(m,tar,{registry:"https://registry.npmjs.org/","//registry.npmjs.org/:_authToken":process.env.NPM_TOK,defaultTag:"beta",access:"public"})
              .then(()=>console.log("C: PUBLISHED",m.version))
              .catch(e=>{const b=e.body&&e.body.toString?e.body.toString():JSON.stringify(e.body);
                console.log("C: FAILED",e.statusCode,"body:",b)});
          '
          exit 0

      - uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "✅ @shipstatic/drop ${{ needs.version.outputs.version }} published (${{ needs.version.outputs.tag }})"

      - if: failure()
        uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "🔴 @shipstatic/drop publish failed"
